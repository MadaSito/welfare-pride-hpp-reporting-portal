# Welfare Pride HPP Reporting Portal — Docker Compose deployment
# See README.md or deploy/install.sh for usage.
#
# Usage:
#   cp .env.docker.example .env
#   # edit .env to set APP_ORIGIN, APP_SESSION_SECRET, APP_ENCRYPTION_KEY
#   docker compose up -d
#   docker compose exec app node --import tsx server/bootstrap-admin.ts --email administrator@example.org
#   # or run the automated installer: ./deploy/install.sh --method=docker

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: welfare-pride-portal:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      DATA_DIR: /app/data
      TRUST_PROXY: "1"
    volumes:
      - portal_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  portal_data:
