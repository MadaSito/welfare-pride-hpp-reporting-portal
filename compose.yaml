services:
  app:
    build: .
    depends_on:
      volume_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN}
      DATABASE_URL: postgresql://hpp:${POSTGRES_PASSWORD}@postgres:5432/hpp_reporting
      DATABASE_SSL: "false"
      APP_SESSION_SECRET: ${APP_SESSION_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      AUDIT_HASH_SALT: ${AUDIT_HASH_SALT}
      DATA_DIR: /app/data
      SIEM_ALLOWED_HOSTS: ${SIEM_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
  postgres:
    image: postgres:16.9-bookworm
    environment:
      POSTGRES_DB: hpp_reporting
      POSTGRES_USER: hpp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpp -d hpp_reporting"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  volume_init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/data/uploads && chown -R 10001:10001 /app/data"]
    volumes:
      - app_data:/app/data
    restart: "no"
  redis:
    image: redis:7.4-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '$$REDIS_PASSWORD' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
  redis_data:
